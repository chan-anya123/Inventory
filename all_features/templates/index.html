<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT Feature - Modular Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { overflow: hidden; background-color: #f8fafc; }
        .nav-active {
            background-color: #eff6ff;
            color: #6366f1;
            border-left: 4px solid #818cf8;
            font-weight: 800;
        }
        .sidebar-item:hover:not(.nav-active) {
            background:#f1f5f9;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 28px;
            border-radius: 16px;
            background: white;
            color: #334155;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); 
            z-index: 9999;
            animation: popUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popUp {
            from { transform: translate(-50%, -40%) scale(0.95); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Pastel Custom Inputs */
        .input-pastel {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #334155;
            transition: all 0.2s;
        }
        .input-pastel:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(165, 180, 252, 0.2);
            outline: none;
        }

        /* Custom Markdown styling */
        .custom-markdown-content h1 {
            font-size: 1.875rem;
            font-weight: 800;
            color: #1e293b;
            margin-top: 2rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 0.5rem;
        }
        .custom-markdown-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #334155;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.25rem;
        }
        .custom-markdown-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #475569;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .custom-markdown-content p {
            margin-bottom: 1rem;
            line-height: 1.625;
            color: #475569;
        }
        .custom-markdown-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .custom-markdown-content ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .custom-markdown-content li {
            margin-bottom: 0.375rem;
            color: #475569;
        }
        .custom-markdown-content a {
            color: #6366f1;
            text-decoration: underline;
            font-weight: 600;
        }
        .custom-markdown-content a:hover {
            color: #4f46e5;
        }
        .custom-markdown-content pre {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin-top: 1rem;
            margin-bottom: 1rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
        .custom-markdown-content code {
            background-color: #f1f5f9;
            color: #ef4444;
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
        }
        .custom-markdown-content pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-size: inherit;
        }
        .custom-markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        .custom-markdown-content th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 700;
            text-align: left;
            padding: 0.75rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .custom-markdown-content td {
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }
        .custom-markdown-content tr:nth-child(even) td {
            background-color: #f8fafc;
        }
        .custom-markdown-content hr {
            margin: 2rem 0;
            border: 0;
            border-top: 1px solid #e2e8f0;
        }
        .custom-markdown-content blockquote {
            border-left: 4px solid #6366f1;
            padding-left: 1rem;
            color: #64748b;
            font-style: italic;
            margin: 1rem 0;
        }
        [v-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="text-slate-800 flex font-sans">

<div id="app" v-cloak class="flex w-full h-screen relative">
    <!-- Toast Notification -->
    <div v-if="toast.show" class="toast" :style="{ borderLeft: toast.ok ? '6px solid #86efac' : '6px solid #fda4af' }">
        <span v-text="toast.msg"></span>
    </div>

    <!-- Sidebar Component -->
    {% include 'components/sidebar.html' %}

    <!-- Main Content Container -->
    <main class="flex-1 overflow-y-auto p-8 custom-scrollbar bg-slate-50">
        <!-- FIFO System Pages -->
        {% include 'pages/dashboard.html' %}
        {% include 'pages/config.html' %}
        {% include 'pages/activity_log.html' %}

        <!-- QR Scanner System Pages -->
        {% include 'pages/qr_scanner.html' %}
        {% include 'pages/qr_config.html' %}

        <!-- Documentation Page -->
        {% include 'pages/manual_view.html' %}
    </main>
</div>

<script>
const { createApp } = Vue

createApp({
    data() {
        return {
            currentPage: 1,
            slots: [],
            users: [], 
            lastHash: "",
            globalUserId: "ROBOT_01",
            newPointName: "",
            formDrop: { point_name: "", item_type: "", note: "" },
            formPickup: { item_type: "" },
            scanResult: { hasScanned: false, slots: [] },
            pickupResult: { show: false, target: "-", note: "-" },
            toast: { show: false, msg: "", ok: true },
            history: [],        
            logFilter: {       
                user: "",
                point: "",
                action: ""
            },
            configSlots: [],
            configUsers: [],
            useSensor: true,
            configUseSensor: true,
            manualUrl: window.location.protocol + '//' + window.location.hostname + ':8081/',

            // QR & Camera States
            cameraEnabled: false,
            isScanning: false,
            showCameraModal: false,
            cameraStreamKey: Date.now(),
            availableCameras: [],
            activeCameraIndex: 0,
            lastQrScan: { text: "", timestamp: 0, formatted_time: "", filename: "", image_url: "" },
            cameraSettings: { brightness: 0, contrast: 1.0, exposure: 0, threshold: 0 },
            cameraProfiles: [],
            newProfileName: "",
            cameraHealth: { camera_connected: true, has_latest_frame: true, seconds_since_last_frame: 0, uptime_seconds: 0 },
            manualMarkdown: "",
            manualRenderedHtml: "",
            isManualLoading: false,

            // Sidebar Dropdown Accordions
            menuOpen: {
                fifo: true,
                qr: true,
                docs: true
            }
        }
    },
    methods: {
        toggleMenu(section) {
            this.menuOpen[section] = !this.menuOpen[section];
        },
        formatTime(isoStr) {
            if (!isoStr || isoStr === "—") return "—";
            try {
                let normalizedStr = isoStr;
                if (isoStr.includes("T") && !isoStr.includes("Z") && !isoStr.slice(isoStr.indexOf("T")).includes("+") && !isoStr.slice(isoStr.indexOf("T")).includes("-")) {
                    normalizedStr = isoStr + "Z";
                }
                const d = new Date(normalizedStr);
                if (isNaN(d.getTime())) return isoStr;
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = String(d.getFullYear()).slice(-2);
                const hours = String(d.getHours()).padStart(2, '0');
                const minutes = String(d.getMinutes()).padStart(2, '0');
                const seconds = String(d.getSeconds()).padStart(2, '0');
                return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
            } catch (e) {
                return isoStr;
            }
        },
        showToast(msg, ok = true) {
            if (this.toastTimer) clearTimeout(this.toastTimer);
            this.toast = { show: true, msg, ok };
            this.toastTimer = setTimeout(() => {
                this.toast.show = false;
            }, 2200);
        },
        async loadSlots() {
            try {
                const res = await fetch("/slots")
                if(!res.ok) return
                const data = await res.json()
                if (this.currentPage !== 1 && this.currentPage !== 'fifo_dashboard') return;
                const hash = data.version || JSON.stringify(data.slots)
                if(hash === this.lastHash) return
                this.lastHash = hash
                
                this.slots = (data.slots || []).map(s => {
                    const hasItem = s.items && s.items.length > 0;
                    return {
                        ...s,
                        items: s.items || [],
                        allowed_item: Array.isArray(s.allowed_item) ? s.allowed_item : [],
                        queue: Array.isArray(s.queue) ? s.queue : [],
                        current_item: hasItem ? s.items[0].item_type : "—",
                        current_in_time: hasItem ? s.items[0].in_time : "—",
                        last_drop_by: s.last_drop_by || "",
                        last_drop_time: s.last_drop_time || "",
                        pickup_by: s.pickup_by || "",
                        out_time: s.out_time || "",
                        status: s.status || (hasItem ? "FULL" : "EMPTY")
                    }
                })
                
                this.users = data.users || []
                this.history = data.history || []
                this.useSensor = data.use_sensor !== undefined ? data.use_sensor : true

            } catch(e) {
                console.error(e)
            }
        },
        async loadHistory() {
            try {
                const res = await fetch("/history")
                if (!res.ok) return
                const data = await res.json()
                this.history = data.history || []
            } catch (e) {
                console.error(e)
            }
        },
        async downloadHistory() {
            try {
                const res = await fetch("/history?limit=10000");
                if (!res.ok) {
                    this.showToast("Failed to fetch history data", false);
                    return;
                }
                const data = await res.json();
                const historyList = data.history || [];
                if (historyList.length === 0) {
                    this.showToast("No history data to download", false);
                    return;
                }
                const csvHeader = "Time,Action,User,Point,Item,Note\n";
                const csvRows = historyList.map(h => {
                    const cleanNote = (h.note || "").replace(/"/g, '""');
                    return `"${h.time || ''}","${h.action || ''}","${h.user_id || ''}","${h.point_name || ''}","${h.item_type || ''}","${cleanNote}"`;
                }).join("\n");
                
                const blob = new Blob([csvHeader + csvRows], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `inventory_history_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                this.showToast("History log exported successfully!", true);
            } catch (e) {
                this.showToast("Error downloading history", false);
            }
        },
        async loadConfigDataOnly() {
            try {
                const res = await fetch("/slots");
                if (!res.ok) return;
                const data = await res.json();
                this.configUsers = JSON.parse(JSON.stringify(data.users || []));
                this.configSlots = JSON.parse(JSON.stringify(data.slots || []));
                this.configUseSensor = data.use_sensor !== undefined ? data.use_sensor : true;
            } catch (e) {
                console.error(e);
            }
        },
        getStatusClass(s) {
            const stat = s.status;
            if (stat === "EMPTY") return "bg-teal-50 text-teal-600 border-teal-200";
            if (stat === "DROP_RESERVED") return "bg-amber-50 text-amber-600 border-amber-200 animate-pulse";
            if (stat === "FULL") return "bg-rose-50 text-rose-600 border-rose-200";
            if (stat === "PICKUP_RESERVED") return "bg-indigo-50 text-indigo-600 border-indigo-200 animate-pulse";
            return "bg-slate-50 text-slate-500 border-slate-200";
        },
        getSlotRowStyle(category) {
            const palettes = [
                "bg-indigo-50/50 hover:bg-indigo-100/50 border-l-4 border-l-indigo-300",
                "bg-emerald-50/50 hover:bg-emerald-100/50 border-l-4 border-l-emerald-300",
                "bg-amber-50/50 hover:bg-amber-100/50 border-l-4 border-l-amber-300",
                "bg-rose-50/50 hover:bg-rose-100/50 border-l-4 border-l-rose-300",
                "bg-purple-50/50 hover:bg-purple-100/50 border-l-4 border-l-purple-300"
            ];
            const activeCategories = Object.keys(this.groupedSlots).filter(k => k !== "ALL ITEMS");
            const index = activeCategories.indexOf(category);
            if (index === -1) {
                return "bg-white hover:bg-slate-50";
            }
            return palettes[index % palettes.length];
        },
        async handleScanAndFill() {
            const item = this.formDrop.item_type.trim();
            if(!item){
                this.showToast("Please input item type", false)
                return
            }
            try {
                const res = await fetch("/slot/suggest", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        item_type: item,
                        user_id: this.globalUserId
                    })
                })
                const data = await res.json()
                this.scanResult.hasScanned = true 

                if(!res.ok){
                    this.scanResult.slots = []
                    this.showToast(data.detail || "No slot found", false)
                    return
                }
                
                this.scanResult.slots = data.slots || []
                if(this.scanResult.slots.length > 0) {
                    this.formDrop.point_name = this.scanResult.slots[0].point_name
                }
                this.showToast(`Found ${this.scanResult.slots.length} slot(s)`, true)
            } catch (e) { this.showToast("Network Error", false) }
        },
        async dropItem() {
            if(!this.formDrop.point_name.trim()){
                this.showToast("Please enter or select Point Name", false);
                return;
            }
            try {
                const res = await fetch("/slot/drop", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        point_name: this.formDrop.point_name.trim(),
                        item_type: this.formDrop.item_type.trim(),
                        user_id: this.globalUserId,
                        note: this.formDrop.note
                    })
                })
                const d = await res.json()
                if(!res.ok) return this.showToast(d.detail || "Error", false)
                
                this.showToast(d.message || "Dropped successfully", true)
                this.formDrop = { point_name: "", item_type: "", note: "" }
                this.scanResult.slots = []
                this.scanResult.hasScanned = false
                this.lastHash = ""
                this.loadSlots()
            } catch (e) { this.showToast("Network Error", false) }
        },
        selectAndFocusSlot(pointName) {
            this.formDrop.point_name = pointName
            this.showToast("Selected " + pointName, true)
        },
        async pickupItem() {
            if(!this.formPickup.item_type.trim()){
                this.showToast("Please input target item type", false);
                return;
            }
            try {
                const res = await fetch("/item/pickup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        item_type: this.formPickup.item_type.trim(),
                        user_id: this.globalUserId
                    })
                })
                const d = await res.json()
                if(!res.ok) {
                    this.pickupResult.show = false
                    return this.showToast(d.detail || "Not found in storage", false)
                }
                
                this.pickupResult.target = d.target_slot || "-"
                this.pickupResult.note = d.dispatched_item?.note ?? "-";
                this.pickupResult.show = true
                this.showToast("Pickup command successfully dispatched!", true)
                this.formPickup.item_type = ""
                this.lastHash = ""
                this.loadSlots()
            } catch (e) { this.showToast("Network Error", false) }
        },
        async resetSlot(pointName) {
            try {
                const res = await fetch("/slot/reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ point_name: pointName })
                })
                if(res.ok) {
                    this.showToast(`Reset ${pointName} Successful`, true)
                    this.lastHash = ""
                    this.loadSlots()
                }
            } catch (e) { this.showToast("Network Error", false) }
        },
        async confirmSlot(pointName) {
            try {
                const res = await fetch("/slot/confirm", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ point_name: pointName })
                })
                const d = await res.json()
                if(res.ok) {
                    this.showToast(d.message || `Confirmed ${pointName} Successful`, true)
                    this.lastHash = ""
                    this.loadSlots()
                } else {
                    this.showToast(d.detail || "Confirmation Failed", false)
                }
            } catch (e) { this.showToast("Network Error", false) }
        },

        // --- QR SCANNER & CAMERA METHODS ---
        async scanQR(target = 'inspect') {
            if (this.isScanning) return;
            this.isScanning = true;
            this.cameraEnabled = true;
            this.showToast("Scanning barcode...", true);
            try {
                const res = await fetch("/read", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ retries: 5, retry_interval: 0.15 })
                });
                const data = await res.json();
                this.isScanning = false;

                if (data.status === "ok") {
                    const raw = data.data;
                    const parsed = data.parsed || {};
                    const itemType = parsed.item_type || raw;
                    
                    this.lastQrScan = {
                        text: raw,
                        timestamp: data.timestamp,
                        formatted_time: new Date().toISOString(),
                        image_url: `/cap_screen?raw=1&t=${Date.now()}`
                    };

                    if (target === 'drop') {
                        this.formDrop.item_type = itemType;
                        if (parsed.point_name) this.formDrop.point_name = parsed.point_name;
                        if (parsed.note) this.formDrop.note = parsed.note;
                        if (parsed.user_id) this.globalUserId = parsed.user_id;
                        this.showToast(`Scanned: "${itemType}"`, true);
                        await this.handleScanAndFill();
                    } else if (target === 'pickup') {
                        this.formPickup.item_type = itemType;
                        if (parsed.user_id) this.globalUserId = parsed.user_id;
                        this.showToast(`Scanned for pickup: "${itemType}"`, true);
                    } else {
                        this.showToast(`Decoded: ${raw}`, true);
                    }
                } else if (data.status === "no_qr") {
                    this.showToast("No QR code detected. Align barcode with camera", false);
                } else {
                    this.showToast(data.message || "Camera error", false);
                }
            } catch (e) {
                this.isScanning = false;
                this.showToast("QR Scan Request Failed", false);
            }
        },
        copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                this.showToast("Copied payload to clipboard!", true);
            }).catch(() => {
                this.showToast("Failed to copy", false);
            });
        },
        useLastQrFor(target) {
            if (!this.lastQrScan.text) return;
            const text = this.lastQrScan.text;
            if (target === 'drop') {
                this.formDrop.item_type = text;
                this.showToast(`Applied "${text}" to Drop`, true);
                this.showCameraModal = false;
                this.handleScanAndFill();
            } else if (target === 'pickup') {
                this.formPickup.item_type = text;
                this.showToast(`Applied "${text}" to Pickup`, true);
                this.showCameraModal = false;
            }
        },
        async openCameraModal() {
            this.showCameraModal = true;
            this.cameraStreamKey = Date.now();
            await this.fetchCameras();
            await this.fetchCameraSettings();
        },
        async fetchCameras() {
            try {
                const res = await fetch("/cameras");
                if (res.ok) {
                    const data = await res.json();
                    this.availableCameras = data.available_cameras || [];
                    this.activeCameraIndex = data.active_index;
                    if (data.enabled !== undefined) {
                        this.cameraEnabled = !!data.enabled;
                    }
                }
            } catch(e) {}
        },
        async enableCamera() {
            try {
                const res = await fetch("/camera/enable", { method: "POST" });
                if (res.ok) {
                    const data = await res.json();
                    this.cameraEnabled = true;
                    this.cameraStreamKey = Date.now();
                    this.showToast("Camera Activated (Live Stream ON)", true);
                    this.fetchCameraHealth();
                }
            } catch(e) {
                this.showToast("Failed to turn on camera", false);
            }
        },
        async disableCamera() {
            try {
                const res = await fetch("/camera/disable", { method: "POST" });
                if (res.ok) {
                    this.cameraEnabled = false;
                    this.showToast("Camera Deactivated (Standby)", true);
                    this.fetchCameraHealth();
                }
            } catch(e) {
                this.showToast("Failed to turn off camera", false);
            }
        },
        async toggleCamera() {
            if (this.cameraEnabled) {
                await this.disableCamera();
            } else {
                await this.enableCamera();
            }
        },
        async switchCamera(idx) {
            try {
                const res = await fetch("/cameras/switch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ index: idx })
                });
                const data = await res.json();
                if (res.ok) {
                    this.activeCameraIndex = data.active_index;
                    this.cameraStreamKey = Date.now();
                    this.showToast(`Switched to Camera ${idx}`, true);
                } else {
                    this.showToast(data.message || "Failed to switch camera", false);
                }
            } catch(e) {
                this.showToast("Error switching camera", false);
            }
        },
        async fetchCameraSettings() {
            try {
                const res = await fetch("/camera/settings");
                if (res.ok) {
                    this.cameraSettings = await res.json();
                }
            } catch(e) {}
        },
        async autoAdjustCamera() {
            try {
                const res = await fetch("/camera/settings/auto_adjust", { method: "POST" });
                const data = await res.json();
                if (res.ok) {
                    this.cameraSettings = data.settings;
                    this.showToast("Camera auto-adjusted for QR!", true);
                }
            } catch(e) {
                this.showToast("Auto-adjust failed", false);
            }
        },
        async resetCameraSettings() {
            try {
                const res = await fetch("/camera/settings/reset", { method: "POST" });
                const data = await res.json();
                if (res.ok) {
                    this.cameraSettings = data.settings;
                    this.showToast("Camera reset to defaults", true);
                }
            } catch(e) {
                this.showToast("Reset failed", false);
            }
        },
        async updateCameraSettings() {
            try {
                const res = await fetch("/camera/settings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(this.cameraSettings)
                });
                if (res.ok) {
                    const data = await res.json();
                    this.cameraSettings = data.settings;
                }
            } catch(e) {}
        },
        async fetchCameraProfiles() {
            try {
                const res = await fetch("/camera/profiles");
                if (res.ok) {
                    const data = await res.json();
                    this.cameraProfiles = data.profiles || [];
                }
            } catch(e) {}
        },
        async saveCameraProfile() {
            const name = this.newProfileName.trim();
            if (!name) return this.showToast("Please enter a profile name", false);
            try {
                const res = await fetch("/camera/profiles/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name, ...this.cameraSettings })
                });
                if (res.ok) {
                    this.newProfileName = "";
                    this.showToast(`Saved profile "${name}"`, true);
                    await this.fetchCameraProfiles();
                } else {
                    this.showToast("Failed to save profile", false);
                }
            } catch(e) {
                this.showToast("Error saving profile", false);
            }
        },
        async loadCameraProfile(filename) {
            try {
                const res = await fetch("/camera/profiles/load", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ filename: filename })
                });
                if (res.ok) {
                    const data = await res.json();
                    this.cameraSettings = data.settings;
                    this.showToast(`Profile applied successfully!`, true);
                } else {
                    this.showToast("Failed to load profile", false);
                }
            } catch(e) {
                this.showToast("Error loading profile", false);
            }
        },
        async fetchCameraHealth() {
            try {
                const res = await fetch("/camera/health");
                if (res.ok) {
                    this.cameraHealth = await res.json();
                }
            } catch(e) {}
        },

        addNewUser() {
            this.configUsers.push({
                user_id: "NEW_USER_" + Math.floor(100 + Math.random() * 900),
                priority: 2,
                role: "Standard Operator"
            })
        },
        deleteUser(index){
            this.configUsers.splice(index,1)
        },
        addNewPoint() {
            const name = this.newPointName.trim().toUpperCase();
            if (!name) return this.showToast("Point name cannot be empty", false);

            if (this.configSlots.some(s => s.point_name.toUpperCase() === name)) {
                return this.showToast("Point already exists", false);
            }

            this.configSlots.push({
                point_name: name,
                enabled: true,
                allowed_item: [],
                items: [],
                queue: [],
                status: "EMPTY",
                last_drop_by: "",
                last_drop_time: "",
                pickup_by: "",
                out_time: ""
            });
            this.newPointName = "";
            this.showToast(`Added ${name}`, true);
        },
        deletePoint(index){
            this.configSlots.splice(index,1);
        },
        updateAllowedItems(index, value) {
            const arr = value
                ? value.split(",").map(x => x.trim()).filter(Boolean)
                : [];
            this.configSlots[index].allowed_item = arr;
        },
        async syncConfigToBackend() {
            try {
                const res = await fetch("/config/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        users: this.configUsers,
                        use_sensor: this.configUseSensor,
                        slots: this.configSlots.map(s => ({
                            slot_id: s.slot_id,
                            point_name: s.point_name,
                            enabled: s.enabled,
                            allowed_item: s.allowed_item,
                            status: s.status,
                            items: s.items || [],
                            queue: s.queue || [],
                            last_drop_by: s.last_drop_by || "",
                            last_drop_time: s.last_drop_time || "",
                            pickup_by: s.pickup_by || "",
                            out_time: s.out_time || ""
                        }))
                    })
                });
                const d = await res.json();
                if(res.ok) {
                    this.showToast("Global config synchronized and saved!", true);
                    this.lastHash = "";
                } else {
                    this.showToast(d.detail || "Sync Failed", false);
                }
            } catch (e) { this.showToast("Network Server Sync Error", false); }
        },
        async fetchManualMarkdown() {
            this.isManualLoading = true;
            try {
                const res = await fetch("/api/manual");
                if (res.ok) {
                    const md = await res.text();
                    this.manualMarkdown = md;
                    if (typeof marked !== 'undefined') {
                        this.manualRenderedHtml = marked.parse(md);
                    } else {
                        this.manualRenderedHtml = `<pre class="p-4 bg-slate-50 rounded-xl overflow-x-auto font-mono text-xs">${md}</pre>`;
                    }
                } else {
                    this.manualRenderedHtml = "<p class='text-rose-500 font-bold'>Error loading user manual from server.</p>";
                }
            } catch (e) {
                this.manualRenderedHtml = "<p class='text-rose-500 font-bold'>Failed to fetch user manual documentation.</p>";
            } finally {
                this.isManualLoading = false;
            }
        },
        reloadManualIframe() {
            this.fetchManualMarkdown();
        }
    },
    computed: {
        groupedSlots() {
            const groups = {};
            this.slots.forEach(s => {
                let category = "ALL ITEMS";
                if (Array.isArray(s.allowed_item) && s.allowed_item.length > 0) {
                    category = s.allowed_item.join(", ");
                }
                if (!groups[category]) {
                    groups[category] = [];
                }
                groups[category].push(s);
            });
            return groups;
        },
        filteredHistory() {
            return this.history.filter(h => {
                const matchesUser = !this.logFilter.user || (h.user_id || "").toLowerCase().includes(this.logFilter.user.toLowerCase());
                const matchesPoint = !this.logFilter.point || (h.point_name || "").toLowerCase().includes(this.logFilter.point.toLowerCase());
                const matchesAction = !this.logFilter.action || (h.action || "").includes(this.logFilter.action);
                return matchesUser && matchesPoint && matchesAction;
            });
        }
    },
    watch: {
        currentPage(page) {
            if(page === 'fifo_dashboard' || page === 1 || page === 'fifo_config' || page === 3 || page === 'fifo_logs' || page === 4){
                this.menuOpen.fifo = true;
            }
            if(page === 'qr_scanner' || page === 2 || page === 'qr_config' || page === 5){
                this.menuOpen.qr = true;
            }
            if(page === 'manual' || page === 6){
                this.menuOpen.docs = true;
            }

            if(page === 'fifo_dashboard' || page === 1){
                this.lastHash = "";
                this.loadSlots();
            }
            if(page === 'fifo_config' || page === 3){
                this.loadConfigDataOnly();
            }
            if(page === 'fifo_logs' || page === 4){
                this.loadHistory();
            }
            if(page === 'qr_scanner' || page === 2){
                this.cameraStreamKey = Date.now();
                this.fetchCameras();
                this.fetchCameraSettings();
            }
            if(page === 'qr_config' || page === 5){
                this.cameraStreamKey = Date.now();
                this.fetchCameras();
                this.fetchCameraSettings();
                this.fetchCameraHealth();
                this.fetchCameraProfiles();
            }
            if(page === 'manual' || page === 6 || page === 5){
                this.fetchManualMarkdown();
            }
        }
    },
    mounted() {
        this.loadSlots()
        this.timer = setInterval(() => {
            if(this.currentPage === 'fifo_dashboard' || this.currentPage === 1){
                this.loadSlots()
            }
            if(this.currentPage === 'fifo_logs' || this.currentPage === 4){
                this.loadHistory()
            }
        }, 1000)
    },
    beforeUnmount() {
        clearInterval(this.timer)
    }
}).mount('#app')
</script>

</body>
</html>
