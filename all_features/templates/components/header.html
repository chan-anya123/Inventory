<!-- Top Dashboard Header Component (Pure Warehouse Status) -->
<div class="flex justify-between items-end mb-8">
    <div>
        <h1 class="text-3xl font-black tracking-tight text-slate-700">Control Dashboard</h1>
        <p class="text-slate-500 text-sm mt-1 font-medium">Real-time FIFO inventory tracking and storage point automation</p>
    </div>
    <div class="flex items-center gap-4">
        <div class="bg-white px-6 py-4 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-6">
            <div class="text-left border-r pr-6 border-slate-100">
                <label class="text-[10px] text-slate-400 block font-bold uppercase tracking-wider mb-1">Operator Profile</label>
                <select v-model="globalUserId" class="input-pastel text-xs font-bold rounded-lg p-1.5 cursor-pointer">
                    <option v-for="u in users" :key="u.user_id" :value="u.user_id" v-text="u.user_id + ' (Priority ' + u.priority + ')'"></option>
                </select>
            </div>
            <div class="text-center border-r pr-6 border-slate-100">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">storage units</div>
                <div class="text-2xl font-black text-indigo-400 leading-none" v-text="slots.length"></div>
            </div>
            <div class="text-right">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Hardware Sensor</div>
                <div :class="['text-xs font-extrabold px-2.5 py-1 rounded-full inline-block', useSensor ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600']" v-text="useSensor ? 'Auto Mode' : 'Manual Mode'">
                </div>
            </div>
        </div>
    </div>
</div>
