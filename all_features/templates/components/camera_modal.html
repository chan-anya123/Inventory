<!-- Live QR Camera Modal Component -->
<div v-if="showCameraModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar border border-slate-100 flex flex-col">
        <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-indigo-500 text-white flex items-center justify-center shadow-md shadow-indigo-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-black text-slate-800">QR Code Camera Monitor</h2>
                    <p class="text-xs text-slate-500 font-medium">Real-time optical QR barcode decoder & camera setup</p>
                </div>
            </div>
            <button @click="showCameraModal = false" class="text-slate-400 hover:text-slate-600 bg-white hover:bg-slate-100 p-2.5 rounded-2xl border border-slate-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <!-- Video Stream Feed -->
            <div class="flex flex-col gap-4">
                <div class="relative bg-slate-950 rounded-2xl overflow-hidden aspect-[4/3] flex items-center justify-center border border-slate-800 shadow-inner">
                    <img :src="'/video_feed?t=' + cameraStreamKey" alt="Live Camera Feed" class="w-full h-full object-cover">
                    <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full text-[10px] font-mono font-bold flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                        LIVE STREAM
                    </div>
                </div>

                <!-- Camera selection & Auto adjust -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">Device Source</label>
                        <button @click="fetchCameras" class="text-[11px] text-indigo-600 hover:underline font-bold">Refresh List</button>
                    </div>
                    <select v-model="activeCameraIndex" @change="switchCamera(activeCameraIndex)" class="input-pastel p-2.5 rounded-xl text-xs font-bold text-slate-700">
                        <option v-for="c in availableCameras" :key="c.index" :value="c.index" v-text="c.name"></option>
                    </select>

                    <div class="flex gap-2 pt-1">
                        <button @click="autoAdjustCamera" class="flex-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 text-xs font-bold py-2 px-3 rounded-xl transition">
                            Auto-Adjust
                        </button>
                        <button @click="resetCameraSettings" class="bg-slate-200 text-slate-700 hover:bg-slate-300 text-xs font-bold py-2 px-3 rounded-xl transition">
                            Reset
                        </button>
                    </div>
                </div>
            </div>

            <!-- QR Scan Controls & Preview -->
            <div class="flex flex-col gap-5">
                <div class="bg-gradient-to-br from-indigo-500 to-indigo-700 p-5 rounded-2xl text-white shadow-lg shadow-indigo-200">
                    <h3 class="font-extrabold text-base mb-1">Instant QR Capture</h3>
                    <p class="text-indigo-100 text-xs mb-4">Position QR code in view and click Scan to decode and trigger warehouse workflows.</p>
                    
                    <div class="flex gap-2">
                        <button @click="scanQR('drop')" :disabled="isScanning" class="flex-1 bg-white text-indigo-600 font-extrabold py-3 px-4 rounded-xl text-xs hover:bg-indigo-50 transition shadow flex items-center justify-center gap-2">
                            <span v-if="isScanning" class="w-3.5 h-3.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></span>
                            <span>Scan for Drop</span>
                        </button>
                        <button @click="scanQR('pickup')" :disabled="isScanning" class="flex-1 bg-teal-400 text-slate-900 font-extrabold py-3 px-4 rounded-xl text-xs hover:bg-teal-300 transition shadow flex items-center justify-center gap-2">
                            <span v-if="isScanning" class="w-3.5 h-3.5 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></span>
                            <span>Scan for Pickup</span>
                        </button>
                    </div>
                </div>

                <!-- Latest Scanned Card -->
                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Last Decoded Result</span>
                        <span v-if="lastQrScan.timestamp" class="text-[10px] text-slate-500 font-mono" v-text="formatTime(lastQrScan.formatted_time || lastQrScan.timestamp)"></span>
                    </div>

                    <div v-if="lastQrScan.text" class="flex flex-col gap-3">
                        <div class="bg-white p-3.5 rounded-xl border border-slate-200">
                            <div class="text-[10px] text-indigo-500 font-bold uppercase mb-1">Decoded Payload</div>
                            <div class="font-mono text-sm font-black text-slate-800 break-all" v-text="lastQrScan.text"></div>
                        </div>

                        <div v-if="lastQrScan.image_url" class="rounded-xl overflow-hidden border border-slate-200 max-h-48 bg-slate-900 flex items-center justify-center">
                            <img :src="lastQrScan.image_url" alt="Scanned Snapshot" class="max-h-48 object-contain">
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button @click="useLastQrFor('drop')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold text-xs py-2 px-3 rounded-xl border border-indigo-200 transition">
                                Fill Drop Form
                            </button>
                            <button @click="useLastQrFor('pickup')" class="bg-teal-100 hover:bg-teal-200 text-teal-700 font-bold text-xs py-2 px-3 rounded-xl border border-teal-200 transition">
                                Fill Pickup Form
                            </button>
                        </div>
                    </div>
                    <div v-else class="text-center text-slate-400 text-xs py-6 font-medium">
                        No QR code scanned in this session yet.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
