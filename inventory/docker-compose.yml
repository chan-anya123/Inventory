services:
  # ------------------------------------
  # Service 1: สำหรับ Main App (พอร์ต 8000)
  # ------------------------------------
  main_app:
    image: fifo_app:latest
    build: .
    container_name: inventory_app
    command: ["python", "main.py"] 
    ports:
      - "8000:8000"
    restart: always
    environment:
      - DISABLE_MANUAL_SERVER=true
    volumes:
      - ./data:/app/data

  # ------------------------------------
  # Service 2: สำหรับ Manual App (พอร์ต 8081)
  # ------------------------------------
  manual_app:
    image: fifo_manual:latest
    build: .
    container_name: inventory_manual
    command: ["python", "manual.py"] 
    ports:
      - "8081:8081" 
    restart: always